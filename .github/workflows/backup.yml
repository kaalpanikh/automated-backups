name: MongoDB Automated Backup

on:
  schedule:
    - cron: '0 */12 * * *'  # Run every 12 hours
  workflow_dispatch:  # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://multi-container-service-mongodb-1:27017/todos
      BACKUP_RETENTION_DAYS: 7
      BACKUP_PREFIX: mongodb-backup
      CONTAINER_NAME: mongodb-backup-${{ github.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 44.203.38.191 >> ~/.ssh/known_hosts
          echo "StrictHostKeyChecking=no" >> ~/.ssh/config

      - name: Create remote directories
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@44.203.38.191 '
            mkdir -p /opt/mongodb-backup
            touch /opt/mongodb-backup/.env
          '

      - name: Copy environment file
        run: |
          echo "MONGODB_URI=${{ env.MONGODB_URI }}" > .env.tmp
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env.tmp
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env.tmp
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }}" >> .env.tmp
          echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> .env.tmp
          echo "BACKUP_RETENTION_DAYS=${{ env.BACKUP_RETENTION_DAYS }}" >> .env.tmp
          echo "BACKUP_PREFIX=${{ env.BACKUP_PREFIX }}" >> .env.tmp
          scp -i ~/.ssh/id_rsa .env.tmp ubuntu@44.203.38.191:/opt/mongodb-backup/.env
          rm .env.tmp

      - name: Copy scripts and set permissions
        run: |
          chmod +x scripts/backup.sh scripts/restore.sh
          scp -i ~/.ssh/id_rsa scripts/backup.sh scripts/restore.sh ubuntu@44.203.38.191:/opt/mongodb-backup/
          ssh -i ~/.ssh/id_rsa ubuntu@44.203.38.191 'chmod +x /opt/mongodb-backup/*.sh'

      - name: Create Docker container for backup
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@44.203.38.191 "
            # Clean up any existing containers
            docker ps -a | grep 'mongodb-backup-' | awk '{print \$1}' | xargs -r docker rm -f

            # Pull MongoDB tools image
            docker pull mongodb/mongodb-community-server:6.0-ubuntu2204

            # Create backup container with root user
            docker create \
              --name ${{ env.CONTAINER_NAME }} \
              --network multi-container-service_app-network \
              -v /opt/mongodb-backup:/backup \
              --user root \
              mongodb/mongodb-community-server:6.0-ubuntu2204

            # Start the container
            docker start ${{ env.CONTAINER_NAME }}

            # Install AWS CLI and jq in the container
            docker exec ${{ env.CONTAINER_NAME }} bash -c '
              mkdir -p /var/lib/apt/lists/partial && \
              apt-get clean && \
              apt-get update && \
              apt-get install -y curl unzip jq && \
              curl \"https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip\" -o \"awscliv2.zip\" && \
              unzip awscliv2.zip && \
              ./aws/install && \
              rm -rf aws awscliv2.zip
            '
          "

      - name: Configure AWS in container
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@44.203.38.191 "
            docker exec ${{ env.CONTAINER_NAME }} mkdir -p /root/.aws
            docker exec ${{ env.CONTAINER_NAME }} bash -c 'cat > /root/.aws/credentials << EOL
            [default]
            aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            region = ${{ secrets.AWS_DEFAULT_REGION }}
            EOL'
          "

      - name: Run backup in container
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@44.203.38.191 "
            docker exec -w /backup ${{ env.CONTAINER_NAME }} bash -c '
              source .env && \
              echo \"Testing MongoDB connection...\" && \
              mongosh --eval \"db.runCommand({ping:1})\" \"$MONGODB_URI\" && \
              echo \"MongoDB connection successful\" && \
              ./backup.sh
            '
            docker stop ${{ env.CONTAINER_NAME }}
            docker rm ${{ env.CONTAINER_NAME }}
          "
