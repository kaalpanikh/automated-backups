name: MongoDB Automated Backup

on:
  schedule:
    - cron: '0 */12 * * *'  # Run every 12 hours
  workflow_dispatch:  # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 44.203.38.191 >> ~/.ssh/known_hosts

      - name: Copy scripts to control node
        run: |
          scp -i ~/.ssh/id_rsa scripts/backup.sh scripts/restore.sh ubuntu@44.203.38.191:/opt/mongodb-backup/

      - name: Run backup on control node
        env:
          MONGODB_URI: mongodb://172.18.0.2:27017/todos
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@44.203.38.191 'cd /opt/mongodb-backup && \
          export MONGODB_URI="${{ env.MONGODB_URI }}" && \
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" && \
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" && \
          export AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}" && \
          export S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}" && \
          export BACKUP_RETENTION_DAYS=7 && \
          export BACKUP_PREFIX=mongodb-backup && \
          ./backup.sh'
